[phases.setup]
  nixPkgs = ["...", "php", "phpPackages.composer", "nodejs", "npm"]

[phases.install]
  dependsOn = ["setup"]
  cmds = ["composer install --no-dev --optimize-autoloader", "npm install", "npm run build"]

[phases.build]
  dependsOn = ["install"]
  cmds = ["php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[start]
  cmd = "vendor/bin/heroku-php-apache2 public/"
